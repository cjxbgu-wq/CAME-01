name: Build VCamUIPatch

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install theos (roothide fork)
        run: |
          git clone --recursive https://github.com/roothide/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Install iOS 16.5 SDK
        run: |
          mkdir -p "$HOME/theos/sdks"
          curl -L --retry 5 -o "$HOME/theos/sdks/iPhoneOS16.5.sdk.tar.xz" \
            https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz
          tar -xf "$HOME/theos/sdks/iPhoneOS16.5.sdk.tar.xz" -C "$HOME/theos/sdks"

      - name: Install ldid (codesign)
        run: brew install ldid

      - name: Build VCamUIPatch
        run: |
          cd VCamUIPatch
          make package FINALPACKAGE=1

      - name: Upload dylib artifact
        uses: actions/upload-artifact@v4
        with:
          name: VCamUIPatch-dylib
          path: VCamUIPatch/.theos/_/Library/MobileSubstrate/DynamicLibraries/VCamUIPatch.dylib
          if-no-files-found: error